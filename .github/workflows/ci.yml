name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # No browser download: the tests here are the URL guard and the CSS analysis,
      # both pure string work. Rendering is exercised against a real WebKit locally
      # and in the engine container, not in CI.
      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Types
        run: npm run typecheck

      - name: Types (engine-api)
        run: npx tsc --noEmit -p engine-api/tsconfig.json

      - name: Tests
        run: npm test
