<!doctype html>
<html>
<head>
<title>Fixed width fixture</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; }
  #wrapper { width: 960px; margin: 0 auto; }
  #header { background: #234; color: #fff; padding: 20px; }
  table { width: 940px; }
  td { padding: 10px; border: 1px solid #ccc; }
</style>
</head>
<body>
<div id="wrapper">
  <div id="header"><h1>Old Fashioned Plumbers</h1></div>
  <table width="940">

    <tr><td colspan="3">Call us on 01234 567890. Family business since 1987.</td></tr>
  </table>
  <p>We cover the whole town and never charge a call-out fee.</p>
</div>
</body>
</html>
